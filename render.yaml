services:
  - type: web
    name: ustaz-lesson-plans
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://ojuvsdtvhlarmyzvdwja.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: USTAZ_TRUST_PROXY
        value: "1"
      - key: USTAZ_ADMIN_PASSWORD
        generateValue: true
